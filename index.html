<!doctype html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="calculator">
      <div class="display">
        <div id="expression"></div>
        <div id="result">0</div>
      </div>

      <div class="buttons">
        <button class="function delete" onclick="deleteNumber()">⌫</button>
        <button class="function" onclick="clearCalculator()">AC</button>
        <button class="function" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="function" onclick="changeSign()">+/−</button>
        <button onclick="addNumber('0')">0</button>
        <button onclick="addDecimal()">.</button>
        <button class="operator" onclick="calculate()">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
